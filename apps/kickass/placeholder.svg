<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0817"/>
      <stop offset="50%" stop-color="#150d2a"/>
      <stop offset="100%" stop-color="#080511"/>
    </linearGradient>

    <!-- Border Glow -->
    <linearGradient id="accentGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ec4899"/>
      <stop offset="50%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="techGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(236, 72, 153, 0.07)" stroke-width="1"/>
    </pattern>

    <!-- Scanline Filter Pattern -->
    <pattern id="scanlines" width="100" height="4" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="100" y2="0" stroke="rgba(0,0,0,0.3)" stroke-width="1.5"/>
    </pattern>
  </defs>

  <!-- Background Base -->
  <rect width="1280" height="720" fill="url(#bgGrad)"/>
  <rect width="1280" height="720" fill="url(#techGrid)"/>

  <!-- Subtle Cyber Ring Accents -->
  <circle cx="640" cy="330" r="260" fill="none" stroke="rgba(236, 72, 153, 0.12)" stroke-width="1" stroke-dasharray="8 6"/>
  <circle cx="640" cy="330" r="290" fill="none" stroke="rgba(6, 182, 212, 0.08)" stroke-width="1" stroke-dasharray="14 10"/>

  <!-- Console Frame Border -->
  <rect x="24" y="24" width="1232" height="672" rx="16" fill="none" stroke="rgba(255, 255, 255, 0.1)" stroke-width="2"/>
  <rect x="24" y="24" width="1232" height="672" rx="16" fill="none" stroke="url(#accentGlow)" stroke-width="2" stroke-opacity="0.6"/>

  <!-- Corner Brackets -->
  <path d="M 44 80 L 44 44 L 80 44" fill="none" stroke="#ec4899" stroke-width="4" stroke-linecap="round"/>
  <path d="M 1236 80 L 1236 44 L 1200 44" fill="none" stroke="#ec4899" stroke-width="4" stroke-linecap="round"/>
  <path d="M 44 640 L 44 676 L 80 676" fill="none" stroke="#ec4899" stroke-width="4" stroke-linecap="round"/>
  <path d="M 1236 640 L 1236 676 L 1200 676" fill="none" stroke="#ec4899" stroke-width="4" stroke-linecap="round"/>

  <!-- Top System Bar -->
  <rect x="44" y="44" width="1192" height="42" rx="8" fill="rgba(255, 255, 255, 0.03)" stroke="rgba(255, 255, 255, 0.06)" stroke-width="1"/>
  <text x="64" y="70" font-family="'Fira Code', monospace" font-size="14" font-weight="700" fill="#ec4899" letter-spacing="1">● NINTENDO SWITCH</text>
  <text x="230" y="70" font-family="'Fira Code', monospace" font-size="13" fill="#94a3b8">| 1280 × 720 (720p Handheld / 1080p Docked)</text>
  <text x="1190" y="70" text-anchor="end" font-family="'Fira Code', monospace" font-size="13" font-weight="600" fill="#10b981">CAPTURE CHANNEL: READY</text>

  <!-- Center Placeholder Hub -->
  <g transform="translate(640, 310)">
    <!-- Outer Glow Capsule -->
    <rect x="-190" y="-120" width="380" height="240" rx="20" fill="rgba(15, 10, 30, 0.7)" stroke="rgba(236, 72, 153, 0.3)" stroke-width="1.5"/>

    <!-- Camera / Screen Icon -->
    <g transform="translate(0, -35)">
      <rect x="-44" y="-30" width="88" height="60" rx="10" fill="rgba(236, 72, 153, 0.15)" stroke="#ec4899" stroke-width="2.5"/>
      <circle cx="0" cy="0" r="18" fill="none" stroke="#06b6d4" stroke-width="2.5"/>
      <circle cx="0" cy="0" r="8" fill="#ec4899"/>
      <circle cx="26" cy="-16" r="4" fill="#06b6d4"/>
      <path d="M -18 -30 L -10 -40 L 10 -40 L 18 -30" fill="rgba(236, 72, 153, 0.2)" stroke="#ec4899" stroke-width="2"/>
    </g>

    <!-- Primary Title -->
    <text x="0" y="45" text-anchor="middle" font-family="'Inter', -apple-system, sans-serif" font-size="22" font-weight="800" fill="#ffffff" letter-spacing="0.5">KICKASS HOMEBREW</text>
    
    <!-- Subtitle Badge -->
    <rect x="-150" y="65" width="300" height="26" rx="6" fill="rgba(236, 72, 153, 0.15)" stroke="rgba(236, 72, 153, 0.3)" stroke-width="1"/>
    <text x="0" y="82" text-anchor="middle" font-family="'Fira Code', monospace" font-size="11" font-weight="700" fill="#f472b6" letter-spacing="0.5">AUTOMATED CAPTURE PENDING</text>
  </g>

  <!-- Bottom Instructions Card -->
  <g transform="translate(640, 560)">
    <rect x="-360" y="0" width="720" height="74" rx="10" fill="rgba(0, 0, 0, 0.5)" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1"/>
    <text x="0" y="32" text-anchor="middle" font-family="'Inter', sans-serif" font-size="15" font-weight="600" fill="#e2e8f0">
      Direct console screen capture placeholder
    </text>
    <text x="0" y="54" text-anchor="middle" font-family="'Fira Code', monospace" font-size="12" fill="#94a3b8">
      Screenshots will appear here once hardware capture automation finishes
    </text>
  </g>

  <!-- Scanline Overlay -->
  <rect width="1280" height="720" fill="url(#scanlines)" opacity="0.4" pointer-events="none"/>
</svg>
