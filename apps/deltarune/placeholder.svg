<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="100%" height="100%">
  <defs>
    <linearGradient id="drBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e0717"/>
      <stop offset="50%" stop-color="#190d2e"/>
      <stop offset="100%" stop-color="#06030c"/>
    </linearGradient>

    <linearGradient id="drGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="50%" stop-color="#ec4899"/>
      <stop offset="100%" stop-color="#ef4444"/>
    </linearGradient>

    <pattern id="drGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(139, 92, 246, 0.07)" stroke-width="1"/>
    </pattern>

    <pattern id="scanlines" width="100" height="4" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="100" y2="0" stroke="rgba(0,0,0,0.3)" stroke-width="1.5"/>
    </pattern>
  </defs>

  <rect width="1280" height="720" fill="url(#drBgGrad)"/>
  <rect width="1280" height="720" fill="url(#drGrid)"/>

  <!-- Console Frame Border -->
  <rect x="24" y="24" width="1232" height="672" rx="16" fill="none" stroke="rgba(255, 255, 255, 0.1)" stroke-width="2"/>
  <rect x="24" y="24" width="1232" height="672" rx="16" fill="none" stroke="url(#drGlow)" stroke-width="2" stroke-opacity="0.6"/>

  <!-- Corner Brackets -->
  <path d="M 44 80 L 44 44 L 80 44" fill="none" stroke="#8b5cf6" stroke-width="4" stroke-linecap="round"/>
  <path d="M 1236 80 L 1236 44 L 1200 44" fill="none" stroke="#8b5cf6" stroke-width="4" stroke-linecap="round"/>
  <path d="M 44 640 L 44 676 L 80 676" fill="none" stroke="#8b5cf6" stroke-width="4" stroke-linecap="round"/>
  <path d="M 1236 640 L 1236 676 L 1200 676" fill="none" stroke="#8b5cf6" stroke-width="4" stroke-linecap="round"/>

  <!-- Top System Bar -->
  <rect x="44" y="44" width="1192" height="42" rx="8" fill="rgba(255, 255, 255, 0.03)" stroke="rgba(255, 255, 255, 0.06)" stroke-width="1"/>
  <text x="64" y="70" font-family="'Fira Code', monospace" font-size="14" font-weight="700" fill="#8b5cf6" letter-spacing="1">● NINTENDO SWITCH (LÖVE POTION NX)</text>
  <text x="440" y="70" font-family="'Fira Code', monospace" font-size="13" fill="#94a3b8">| Chapters 1–5 GameMaker DS-List Hex Codec</text>
  <text x="1190" y="70" text-anchor="end" font-family="'Fira Code', monospace" font-size="13" font-weight="600" fill="#10b981">CAPTURE CHANNEL: READY</text>

  <!-- Center Placeholder Hub -->
  <g transform="translate(640, 310)">
    <rect x="-210" y="-120" width="420" height="240" rx="20" fill="rgba(20, 10, 35, 0.75)" stroke="rgba(139, 92, 246, 0.35)" stroke-width="1.5"/>

    <!-- Heart SOUL / Screen Icon -->
    <g transform="translate(0, -35)">
      <rect x="-44" y="-30" width="88" height="60" rx="10" fill="rgba(139, 92, 246, 0.15)" stroke="#8b5cf6" stroke-width="2.5"/>
      <!-- Pixel SOUL Heart -->
      <path d="M 0 10 C -16 -6, -20 -18, -10 -22 C -4 -24, 0 -18, 0 -14 C 0 -18, 4 -24, 10 -22 C 20 -18, 16 -6, 0 10 Z" fill="#ef4444" transform="translate(0, 4) scale(0.9)"/>
      <path d="M -18 -30 L -10 -40 L 10 -40 L 18 -30" fill="rgba(139, 92, 246, 0.2)" stroke="#8b5cf6" stroke-width="2"/>
    </g>

    <!-- Primary Title -->
    <text x="0" y="45" text-anchor="middle" font-family="'Inter', -apple-system, sans-serif" font-size="22" font-weight="800" fill="#ffffff" letter-spacing="0.5">DELTARUNE SAVE EDITOR</text>
    
    <!-- Subtitle Badge -->
    <rect x="-160" y="65" width="320" height="26" rx="6" fill="rgba(139, 92, 246, 0.15)" stroke="rgba(139, 92, 246, 0.3)" stroke-width="1"/>
    <text x="0" y="82" text-anchor="middle" font-family="'Fira Code', monospace" font-size="11" font-weight="700" fill="#c084fc" letter-spacing="0.5">CONSOLE SCREEN CAPTURE PENDING</text>
  </g>

  <!-- Bottom Instructions Card -->
  <g transform="translate(640, 560)">
    <rect x="-380" y="0" width="760" height="74" rx="10" fill="rgba(0, 0, 0, 0.5)" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1"/>
    <text x="0" y="32" text-anchor="middle" font-family="'Inter', sans-serif" font-size="15" font-weight="600" fill="#e2e8f0">
      Nintendo Switch LÖVE Potion app screenshot placeholder
    </text>
    <text x="0" y="54" text-anchor="middle" font-family="'Fira Code', monospace" font-size="12" fill="#94a3b8">
      Console captures will be shown here directly
    </text>
  </g>

  <!-- Scanline Overlay -->
  <rect width="1280" height="720" fill="url(#scanlines)" opacity="0.4" pointer-events="none"/>
</svg>
