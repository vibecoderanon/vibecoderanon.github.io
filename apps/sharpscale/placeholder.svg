<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="100%" height="100%">
  <defs>
    <linearGradient id="ssBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070d1a"/>
      <stop offset="50%" stop-color="#0b172e"/>
      <stop offset="100%" stop-color="#050811"/>
    </linearGradient>

    <linearGradient id="ssGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="50%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>

    <pattern id="ssGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(59, 130, 246, 0.07)" stroke-width="1"/>
    </pattern>

    <pattern id="scanlines" width="100" height="4" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="100" y2="0" stroke="rgba(0,0,0,0.3)" stroke-width="1.5"/>
    </pattern>
  </defs>

  <rect width="1280" height="720" fill="url(#ssBgGrad)"/>
  <rect width="1280" height="720" fill="url(#ssGrid)"/>

  <!-- Subtle Pixel Calibration Crosshairs -->
  <line x1="640" y1="120" x2="640" y2="520" stroke="rgba(59, 130, 246, 0.15)" stroke-width="1" stroke-dasharray="6 4"/>
  <line x1="280" y1="320" x2="1000" y2="320" stroke="rgba(59, 130, 246, 0.15)" stroke-width="1" stroke-dasharray="6 4"/>

  <!-- Console Frame Border -->
  <rect x="24" y="24" width="1232" height="672" rx="16" fill="none" stroke="rgba(255, 255, 255, 0.1)" stroke-width="2"/>
  <rect x="24" y="24" width="1232" height="672" rx="16" fill="none" stroke="url(#ssGlow)" stroke-width="2" stroke-opacity="0.6"/>

  <!-- Corner Brackets -->
  <path d="M 44 80 L 44 44 L 80 44" fill="none" stroke="#3b82f6" stroke-width="4" stroke-linecap="round"/>
  <path d="M 1236 80 L 1236 44 L 1200 44" fill="none" stroke="#3b82f6" stroke-width="4" stroke-linecap="round"/>
  <path d="M 44 640 L 44 676 L 80 676" fill="none" stroke="#3b82f6" stroke-width="4" stroke-linecap="round"/>
  <path d="M 1236 640 L 1236 676 L 1200 676" fill="none" stroke="#3b82f6" stroke-width="4" stroke-linecap="round"/>

  <!-- Top System Bar -->
  <rect x="44" y="44" width="1192" height="42" rx="8" fill="rgba(255, 255, 255, 0.03)" stroke="rgba(255, 255, 255, 0.06)" stroke-width="1"/>
  <text x="64" y="70" font-family="'Fira Code', monospace" font-size="14" font-weight="700" fill="#3b82f6" letter-spacing="1">● SWITCH (Sharpscale-NX) &amp; 3DS (Sharpscale-3DS)</text>
  <text x="560" y="70" font-family="'Fira Code', monospace" font-size="13" fill="#94a3b8">| 1080p / 720p / 800×240 Integer Overrides</text>
  <text x="1190" y="70" text-anchor="end" font-family="'Fira Code', monospace" font-size="13" font-weight="600" fill="#10b981">CAPTURE CHANNEL: READY</text>

  <!-- Center Placeholder Hub -->
  <g transform="translate(640, 310)">
    <rect x="-220" y="-120" width="440" height="240" rx="20" fill="rgba(10, 18, 38, 0.75)" stroke="rgba(59, 130, 246, 0.35)" stroke-width="1.5"/>

    <!-- Scaler / Lens Icon -->
    <g transform="translate(0, -35)">
      <rect x="-44" y="-30" width="88" height="60" rx="10" fill="rgba(59, 130, 246, 0.15)" stroke="#3b82f6" stroke-width="2.5"/>
      <circle cx="0" cy="0" r="18" fill="none" stroke="#06b6d4" stroke-width="2.5"/>
      <line x1="-8" y1="0" x2="8" y2="0" stroke="#38bdf8" stroke-width="2"/>
      <line x1="0" y1="-8" x2="0" y2="8" stroke="#38bdf8" stroke-width="2"/>
      <circle cx="26" cy="-16" r="4" fill="#10b981"/>
      <path d="M -18 -30 L -10 -40 L 10 -40 L 18 -30" fill="rgba(59, 130, 246, 0.2)" stroke="#3b82f6" stroke-width="2"/>
    </g>

    <!-- Primary Title -->
    <text x="0" y="45" text-anchor="middle" font-family="'Inter', -apple-system, sans-serif" font-size="22" font-weight="800" fill="#ffffff" letter-spacing="0.5">SHARPSCALE SUITE</text>
    
    <!-- Subtitle Badge -->
    <rect x="-170" y="65" width="340" height="26" rx="6" fill="rgba(59, 130, 246, 0.15)" stroke="rgba(59, 130, 246, 0.3)" stroke-width="1"/>
    <text x="0" y="82" text-anchor="middle" font-family="'Fira Code', monospace" font-size="11" font-weight="700" fill="#60a5fa" letter-spacing="0.5">CONSOLE SCREEN CAPTURE PENDING</text>
  </g>

  <!-- Bottom Instructions Card -->
  <g transform="translate(640, 560)">
    <rect x="-380" y="0" width="760" height="74" rx="10" fill="rgba(0, 0, 0, 0.5)" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1"/>
    <text x="0" y="32" text-anchor="middle" font-family="'Inter', sans-serif" font-size="15" font-weight="600" fill="#e2e8f0">
      Hardware display scaling capture placeholder
    </text>
    <text x="0" y="54" text-anchor="middle" font-family="'Fira Code', monospace" font-size="12" fill="#94a3b8">
      Crisp integer-scaled Switch &amp; 3DS output images will be slotted directly here
    </text>
  </g>

  <!-- Scanline Overlay -->
  <rect width="1280" height="720" fill="url(#scanlines)" opacity="0.4" pointer-events="none"/>
</svg>
